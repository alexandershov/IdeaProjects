<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game of Life</title>
    <style>
        .cell {
            width: 10px;
            height: 10px;
        }

        .live {
            background-color: #2563eb;
        }

        .dead {
            background-color: #9ca3af;
        }
    </style>
    <script>
        let GAME = {size: 50, grid: new Map(), state: 'updating', delay: 0.01};

        function toggleUpdating() {
            let button = document.getElementById("toggleButton");
            if (GAME.state === 'updating') {
                button.innerText = 'Continue';
                GAME.state = 'paused';
            } else if (GAME.state === 'paused') {
                button.innerText = 'Pause';
                GAME.state = 'updating';
                startUpdating();
            } else {
                alert(`unknown state ${GAME.state}`);
            }
        }

        function isCellLive(grid, r, c) {
            return !!grid.get(makeKey(r, c));
        }

        function makeKey(r, c) {
            return `${r}_${c}`
        }

        function parseKey(key) {
            let split = key.split("_");
            return [parseInt(split[0]), parseInt(split[1])];
        }

        function step() {
            let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
            for ([key, isLive] of GAME.grid) {
                if (!isLive) {
                    continue;
                }
                let [r, c] = parseKey(key);
                minR = Math.min(r, minR);
                maxR = Math.max(r, maxR);
                minC = Math.min(c, minC);
                maxC = Math.max(c, maxC);
            }

            if (minR === Infinity) {
                // no live cells
                return;
            }

            let nextGrid = new Map();
            for (let r = minR - 1; r <= maxR + 1; r++) {
                for (let c = minC - 1; c <= maxC + 1; c++) {
                    let numLiveNeighbours = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) {
                                continue;
                            }
                            if (isCellLive(GAME.grid, r + dr, c + dc)) {
                                numLiveNeighbours++;
                            }
                        }
                    }
                    let isLive = isCellLive(GAME.grid, r, c);
                    if (isLive && (numLiveNeighbours === 2 || numLiveNeighbours === 3)) {
                        nextGrid.set(makeKey(r, c), true);
                    } else if (!isLive && numLiveNeighbours === 3) {
                        nextGrid.set(makeKey(r, c), true);
                    }
                }
            }
            GAME.grid = nextGrid;
        }

    </script>
</head>
<body>
<button onclick="toggleUpdating()" id="toggleButton">Pause</button>
<script>
    function createGrid(size) {
        let body = document.getElementsByTagName("body")[0];
        let table = document.createElement("table");
        table.id = "grid";
        for (let r = 0; r < size; r++) {
            let row = table.insertRow();
            for (let c = 0; c < size; c++) {
                let cell = row.insertCell();
                cell.className = "dead cell";
                cell.onclick = () => toggleCell(size - r - 1, c);
            }
        }
        body.appendChild(table);
    }

    function toggleCell(r, c) {
        let table = document.getElementById("grid");
        let row = table.rows[GAME.size - r - 1];
        let cell = row.cells[c];
        let isLive = isCellLive(GAME.grid, r, c);
        GAME.grid.set(makeKey(r, c), !isLive);
        if (isLive) {
            cell.className = "dead cell";
        } else {
            cell.className = "live cell";
        }
    }

    function showGrid(grid) {
        let table = document.getElementById("grid");
        let numRows = table.rows.length;
        let numColumns = table.rows[0].cells.length;
        for (let r = 0; r < numRows; r++) {
            for (let c = 0; c < numColumns; c++) {
                let cell = table.rows[numRows - r - 1].cells[c];
                if (isCellLive(GAME.grid, r, c)) {
                    cell.className = "live cell";
                } else {
                    cell.className = "dead cell";
                }
            }
        }
    }

    function startUpdating() {
        if (GAME.state === 'paused') {
            return;
        }
        step();
        showGrid(GAME.grid);
        setTimeout(startUpdating, GAME.delay * 1000)
    }

    createGrid(GAME.size);
    showGrid(GAME.grid);
    startUpdating();
</script>
</body>
</html>
